<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click Counter by Veer!</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffe4f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #ff69b4;
      font-size: 3rem;
    }
    #counter {
      font-size: 2rem;
      margin: 20px;
      color: #333;
    }
    button {
      background-color: #ffb6c1;
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ff69b4;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Click Counter</h1>
  <div id="counter">0</div>
  <button onclick="increaseCount()">Click me!</button>

  <script>
    let count = 0;
    function increaseCount() {
      count++;
      document.getElementById('counter').innerText = count;
    }
  </script>

</body>
</html>
